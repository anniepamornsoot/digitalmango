<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DigitalMango — Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #F6EFE3; color: #1F3B36; }
  ul { padding: 0; margin: 0; }
  a { color: inherit; }
  details summary::-webkit-details-marker { display: none; }
  details summary::marker { display: none; }
  details[open] summary > span:last-child { transform: rotate(45deg); display: inline-block; }
  details summary > span:last-child { transition: transform .2s ease; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react" src="home/shared.jsx"></script>
<script type="text/babel" data-presets="react" src="home/nav-only.jsx"></script>
<script type="text/babel" data-presets="react" src="home/faq-contact.jsx"></script>

<script type="text/babel" data-presets="react">
  const S = window.SHARED;
  const StickerC = window.Sticker, ChunkyBtnC = window.ChunkyBtn;

  const Hero = () => (
    <div style={{ padding: "80px 56px 60px", position: "relative", overflow: "hidden" }}>
      <div style={{ position: "absolute", top: 100, right: 100 }}>
        <StickerC bg={S.honey} rotate={-6}>★ booking jul–sep 2026</StickerC>
      </div>
      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .55 }}>Services</span>
      <h1 style={{ fontSize: 156, lineHeight: 0.88, letterSpacing: "-0.05em", fontWeight: 800, margin: "16px 0 0" }}>
        Three flavors,<br/>
        <span style={{ background: S.mango, color: S.ink, padding: "0 22px", borderRadius: 24, border: `4px solid ${S.ink}`, display: "inline-block", boxShadow: `0 8px 0 ${S.ink}`, fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, transform: "rotate(-1.5deg)" }}>same</span> orchard.
      </h1>
      <p style={{ marginTop: 32, fontSize: 22, lineHeight: 1.5, color: S.ink2, maxWidth: "60ch", fontWeight: 500 }}>
        Hand-built websites, refreshes, and ongoing care — for small &amp; medium brands who want their site to feel as warm as the work behind it.
      </p>
    </div>
  );

  const Detail = ({ id, num, t, sub, body, price, time, deliverables, perfect, notFor, bg, color, accent }) => {
    const ink = S.ink, cream = S.cream;
    const isDark = color === cream;
    return (
      <div id={id} style={{ background: bg, color: color || ink, padding: "100px 56px", borderTop: `4px solid ${ink}` }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1.2fr", gap: 56 }}>
          <div>
            <span style={{ background: cream, color: ink, padding: "8px 14px", borderRadius: 999, border: `2px solid ${ink}`, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".14em", fontWeight: 700, display: "inline-block" }}>NO. {num}</span>
            <h2 style={{ fontWeight: 800, fontSize: 88, lineHeight: 0.95, letterSpacing: "-0.04em", marginTop: 22 }}>{t}</h2>
            <p style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontSize: 28, lineHeight: 1.3, marginTop: 18, opacity: .85, maxWidth: "26ch" }}>{sub}</p>

            <div style={{ marginTop: 32, display: "flex", gap: 16, flexWrap: "wrap" }}>
              <div style={{ background: cream, color: ink, border: `2.5px solid ${ink}`, borderRadius: 18, padding: "16px 22px", boxShadow: `0 6px 0 ${ink}` }}>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: ".18em", fontWeight: 700, opacity: .55 }}>STARTS AT</div>
                <div style={{ fontWeight: 800, fontSize: 30, letterSpacing: "-0.02em", marginTop: 4 }}>{price}</div>
              </div>
              <div style={{ background: accent, color: ink, border: `2.5px solid ${ink}`, borderRadius: 18, padding: "16px 22px", boxShadow: `0 6px 0 ${ink}` }}>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: ".18em", fontWeight: 700, opacity: .65 }}>TIMELINE</div>
                <div style={{ fontWeight: 800, fontSize: 30, letterSpacing: "-0.02em", marginTop: 4 }}>{time}</div>
              </div>
            </div>
            <div style={{ marginTop: 28 }}>
              <ChunkyBtnC bg={S.mango} color={ink}>Book {t.split(" ")[0].toLowerCase()} →</ChunkyBtnC>
            </div>
          </div>

          <div>
            <p style={{ fontSize: 18, lineHeight: 1.65, opacity: isDark ? .9 : .85, maxWidth: "56ch" }}>{body}</p>

            <h3 style={{ marginTop: 36, fontSize: 14, fontFamily: "'JetBrains Mono', monospace", letterSpacing: ".18em", textTransform: "uppercase", fontWeight: 700, opacity: .7 }}>What's included</h3>
            <ul style={{ marginTop: 16, listStyle: "none", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              {deliverables.map((d, i) => (
                <li key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start", fontSize: 15, fontWeight: 600 }}>
                  <span style={{ flexShrink: 0, marginTop: 2, width: 20, height: 20, borderRadius: "50%", background: S.mango, color: ink, border: `1.5px solid ${ink}`, display: "grid", placeItems: "center", fontSize: 11, fontWeight: 800 }}>✓</span>
                  {d}
                </li>
              ))}
            </ul>

            <div style={{ marginTop: 32, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
              <div style={{ background: cream, color: ink, border: `2.5px solid ${ink}`, borderRadius: 18, padding: 20 }}>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: ".18em", fontWeight: 700, color: S.leaf }}>PERFECT FOR</div>
                <div style={{ marginTop: 8, fontSize: 14.5, lineHeight: 1.55, fontWeight: 500 }}>{perfect}</div>
              </div>
              <div style={{ background: cream, color: ink, border: `2.5px solid ${ink}`, borderRadius: 18, padding: 20 }}>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: ".18em", fontWeight: 700, color: S.clay }}>NOT FOR</div>
                <div style={{ marginTop: 8, fontSize: 14.5, lineHeight: 1.55, fontWeight: 500 }}>{notFor}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  };

  const Compare = () => (
    <div style={{ padding: "100px 56px", background: S.cream2, borderTop: `4px solid ${S.ink}` }}>
      <div style={{ textAlign: "center", marginBottom: 48 }}>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .55 }}>04 — At a glance</span>
        <h2 style={{ fontWeight: 800, fontSize: 64, lineHeight: 1, letterSpacing: "-0.035em", marginTop: 14 }}>
          Side by <span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, color: S.mango }}>side.</span>
        </h2>
      </div>
      <div style={{ background: S.cream, border: `3px solid ${S.ink}`, borderRadius: 24, boxShadow: `0 8px 0 ${S.ink}`, overflow: "hidden" }}>
        {[
          ["", "New website", "Refresh", "Care"],
          ["Custom design", "✓", "—", "—"],
          ["Page-by-page polish", "✓", "✓", "—"],
          ["Bilingual EN / TH", "✓", "✓", "—"],
          ["Speed & SEO pass", "✓", "✓", "✓"],
          ["Monthly updates", "1 mo free", "—", "✓"],
          ["Priority replies", "—", "—", "✓"],
          ["Starting price", "฿35,000", "฿18,000", "฿6,000/mo"],
        ].map((row, i) => (
          <div key={i} style={{
            display: "grid", gridTemplateColumns: "1.5fr 1fr 1fr 1fr",
            padding: "16px 24px",
            background: i === 0 ? S.ink : "transparent",
            color: i === 0 ? S.cream : S.ink,
            fontWeight: i === 0 || row[0] === "Starting price" ? 700 : 500,
            fontSize: i === 0 ? 13 : 15,
            fontFamily: i === 0 ? "'JetBrains Mono', monospace" : "inherit",
            letterSpacing: i === 0 ? ".18em" : "0",
            textTransform: i === 0 ? "uppercase" : "none",
            borderTop: i > 0 ? `1.5px solid ${S.ink}1a` : "none"
          }}>
            {row.map((c, j) => (
              <div key={j} style={{ textAlign: j === 0 ? "left" : "center" }}>{c}</div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );

  const AddOns = () => {
    const items = [
      { t: "Extra page", price: "฿4,500/page", body: "Need a Careers, Press, or Menu page on top of the base scope?" },
      { t: "Copywriting pass", price: "฿8,000+", body: "I write or polish your copy in plain, friendly English." },
      { t: "Photo direction", price: "฿6,000", body: "I'll brief a photographer or curate stock that fits the brand." },
      { t: "Booking integration", price: "฿4,000", body: "Calendly, Cal.com, or a custom Line booking flow." },
      { t: "E-commerce light", price: "฿12,000+", body: "A small Shopify or Snipcart store, up to 30 products." },
      { t: "Animation polish", price: "฿5,000", body: "Custom scroll, hover, and micro-interactions where they matter." },
    ];
    return (
      <div style={{ padding: "100px 56px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 2.2fr", gap: 56, alignItems: "start", marginBottom: 40 }}>
          <div>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .55 }}>05 — Add-ons</span>
            <h2 style={{ fontWeight: 800, fontSize: 56, lineHeight: 1, letterSpacing: "-0.035em", marginTop: 14 }}>
              Pick a la <span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, color: S.mango }}>carte.</span>
            </h2>
          </div>
          <p style={{ fontSize: 18, lineHeight: 1.6, color: S.ink2, maxWidth: "60ch" }}>
            Bolt these onto any package, or get a quote for them on their own. Quoted up-front, fixed price.
          </p>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 18 }}>
          {items.map((a, i) => (
            <div key={i} style={{ background: S.cream2, border: `2.5px solid ${S.ink}`, borderRadius: 22, padding: 24, boxShadow: `0 6px 0 ${S.ink}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <h3 style={{ fontSize: 22, fontWeight: 700, letterSpacing: "-0.02em" }}>{a.t}</h3>
                <span style={{ background: S.mango, color: S.ink, padding: "4px 10px", borderRadius: 999, border: `1.5px solid ${S.ink}`, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: ".08em" }}>{a.price}</span>
              </div>
              <p style={{ marginTop: 12, fontSize: 14, lineHeight: 1.55, color: S.ink2, fontWeight: 500 }}>{a.body}</p>
            </div>
          ))}
        </div>
      </div>
    );
  };

  const ProcessMini = () => {
    const steps = [
      { n: "01", t: "Free chat", body: "30-min call, no pitch." },
      { n: "02", t: "Tasting menu", body: "Written proposal, fixed price." },
      { n: "03", t: "Sketch & taste", body: "Two design directions, you pick." },
      { n: "04", t: "Build & ship", body: "Hand-coded, polished, live." },
    ];
    return (
      <div style={{ padding: "100px 56px", background: S.leaf, color: S.cream, borderTop: `4px solid ${S.ink}` }}>
        <div style={{ textAlign: "center", marginBottom: 48 }}>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .7 }}>06 — How we work</span>
          <h2 style={{ fontWeight: 800, fontSize: 64, lineHeight: 1, letterSpacing: "-0.035em", marginTop: 14 }}>
            Same process,<br/><span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, color: S.honey }}>every project.</span>
          </h2>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 18 }}>
          {steps.map((s, i) => (
            <div key={i} style={{ background: S.cream, color: S.ink, border: `3px solid ${S.ink}`, borderRadius: 22, padding: 24, boxShadow: `0 6px 0 ${S.ink}` }}>
              <span style={{ background: S.mango, color: S.ink, padding: "5px 11px", borderRadius: 999, border: `1.5px solid ${S.ink}`, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: ".14em" }}>STEP {s.n}</span>
              <h3 style={{ marginTop: 18, fontSize: 24, fontWeight: 700, letterSpacing: "-0.02em" }}>{s.t}</h3>
              <p style={{ marginTop: 8, fontSize: 14, color: S.ink2, fontWeight: 500 }}>{s.body}</p>
            </div>
          ))}
        </div>
      </div>
    );
  };

  const App = () => (
    <div data-screen-label="Services">
      <window.Nav />
      <Hero />
      <Detail
        id="new" num="01" t="New websites" sub='"From a blank page to a live, breathing site."'
        body="Strategy, design, and build for brands launching fresh — or replacing a site that no longer fits. We start with a free 30-min call, then I send a written proposal with scope, timeline, and a fixed price. You'll see two design directions in Figma before we commit. Built end-to-end by one person who actually answers your messages."
        price="฿35,000+" time="4–6 weeks" bg={S.cream} accent={S.honey}
        deliverables={["Strategy & sitemap", "Custom Figma design (2 directions)", "Hand-coded build (Webflow / Framer / custom)", "Bilingual EN / TH ready", "Speed & SEO pass", "Mobile + tablet polish", "1 month free care", "Founder handover call"]}
        perfect="Brands that have outgrown a Wix template, founders launching a new shop or studio, teams who want a custom site without a 6-month engagement."
        notFor="Marketplaces, complex SaaS dashboards, or anything needing a back-end team. Refer you to a friend if so."
      />
      <Detail
        id="refresh" num="02" t="Refreshes" sub='"Same content, new posture."'
        body="For sites that work but feel tired. A focused 2–3 week sprint that gives your existing site a fresh face — without rebuilding from zero. Same pages, same copy (mostly), better posture. We pick the 5 biggest visual issues, fix them, and you ship a site that finally matches your brand."
        price="฿18,000+" time="2–3 weeks" bg={S.cream2} accent={S.mango}
        deliverables={["Visual audit (top 5 issues)", "New design system (color, type, spacing)", "Page-by-page polish", "New hero & key sections", "Speed pass", "Mobile cleanup", "Before/after handover", "2 weeks of free tweaks"]}
        perfect="Sites built 2–4 years ago that still convert but look dated. Brands that just rebranded and need the site to catch up."
        notFor="Sites that need a full re-architecture or new pages — that's a New Website project."
      />
      <Detail
        id="care" num="03" t="Care & iteration" sub='"A friendly hand on your site, every month."'
        body="A monthly retainer where I'm in your inbox — fixing, tweaking, growing your site every month so it never goes stale. Updates, content additions, new sections, A/B copy tweaks, monthly speed checks. You get priority replies (within 4 working hours) and a short monthly report on what changed and why."
        price="฿6,000/mo" time="Monthly · 3-month minimum" bg={S.ink} color={S.cream} accent={S.honey}
        deliverables={["Up to 4 hours of changes/month", "Content & copy updates", "New sections & small pages", "Monthly speed & SEO check", "Priority replies (< 4h)", "Monthly written report", "Pause anytime after month 3", "Hours roll over 1 month"]}
        perfect="Founders who launched with me (or someone else) and want a hand on the site without hiring in-house."
        notFor="Daily-content blogs, complex e-commerce ops, or 24/7 support. I'm a small studio, not an agency."
      />
      <Compare />
      <AddOns />
      <ProcessMini />
      <window.FAQ />
      <window.Contact />
      <window.Footer />
    </div>
  );

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

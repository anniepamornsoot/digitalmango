<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DigitalMango — Sundara Bakery (Case Study)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #F6EFE3; color: #1F3B36; }
  ul { padding: 0; margin: 0; }
  a { color: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react" src="home/shared.jsx"></script>
<script type="text/babel" data-presets="react" src="home/hero.jsx"></script>

<script type="text/babel" data-presets="react">
  const S = window.SHARED;

  const Hero = () => (
    <div style={{ padding: "60px 56px 40px" }}>
      <a href="work.html" style={{ textDecoration: "none", display: "inline-flex", alignItems: "center", gap: 8, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .7, marginBottom: 32 }}>← Back to all work</a>

      <div style={{ display: "flex", gap: 12, marginBottom: 32 }}>
        <Sticker bg={S.honey}>case · 01</Sticker>
        <Sticker bg={S.mango}>bakery · bangkok</Sticker>
        <Sticker bg={S.leaf} color={S.cream}>shipped 2025</Sticker>
      </div>

      <h1 style={{ fontSize: 132, lineHeight: 0.9, letterSpacing: "-0.045em", fontWeight: 800, margin: 0 }}>
        Sundara Bakery —<br/>
        <span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, color: S.mango }}>a small, kind shop</span><br/>
        online.
      </h1>

      <p style={{ marginTop: 32, fontSize: 22, lineHeight: 1.5, color: S.ink2, maxWidth: "60ch" }}>
        A 6-page bilingual site for a Sukhumvit bakery — refreshed in 12 days. Same warmth as the shop, +38% leads in the first month.
      </p>
    </div>
  );

  const Showcase = () => (
    <div style={{ padding: "20px 56px 80px" }}>
      <div style={{ aspectRatio: "16/9", borderRadius: 24, border: `3px solid ${S.ink}`, boxShadow: `0 14px 0 ${S.ink}`,
        background: `radial-gradient(circle at 30% 25%, ${S.honey}, transparent 55%), linear-gradient(160deg, ${S.mango} 0%, #D9892A 70%)`,
        position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", inset: 24, borderRadius: 14, background: S.cream, padding: 32, display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .55 }}>
            <span>SUNDARA / HOME</span><span>desktop · 1440</span>
          </div>
          <div style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontSize: 96, lineHeight: 0.95, color: S.ink, maxWidth: "10ch" }}>
            "fresh<br/>from the<br/>oven."
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".14em", opacity: .6 }}>
            <span>HERO PLACEHOLDER · DROP REAL SCREENSHOT HERE</span>
            <span>+38% LEADS ↗</span>
          </div>
        </div>
      </div>
    </div>
  );

  const Stats = () => (
    <div style={{ padding: "60px 56px", background: S.ink, color: S.cream, borderTop: `4px solid ${S.ink}` }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 28 }}>
        {[
          { n: "12", u: "days", l: "Kickoff to launch" },
          { n: "6", u: "pages", l: "EN + TH bilingual" },
          { n: "+38%", u: "", l: "Leads, month 1" },
          { n: "1.2s", u: "", l: "Lighthouse FCP" },
        ].map((s, i) => (
          <div key={i}>
            <div style={{ fontWeight: 800, fontSize: 72, letterSpacing: "-0.04em", lineHeight: 1 }}>{s.n}<span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontSize: 32, color: S.mango, marginLeft: 6 }}>{s.u}</span></div>
            <div style={{ marginTop: 8, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .65, fontWeight: 700 }}>{s.l}</div>
          </div>
        ))}
      </div>
    </div>
  );

  const Story = () => {
    const blocks = [
      { num: "01", h: "The brief", body: "Sundara had been baking for 8 years out of a single Sukhumvit shop. Word-of-mouth carried them — until COVID, when the foot traffic stopped and a 2014 Wix site couldn't pick up the slack. The owner, Khun Ploy, didn't want a 'modern startup' look. She wanted the warmth of the actual shop, online." },
      { num: "02", h: "The approach", body: "We threw out the brief that said 'modern, sleek, conversion-optimized' and replaced it with three words: small, kind, neighborhood. Cream paper backgrounds, hand-set headlines in italic, photos that smelled like Sunday morning. Bilingual EN+TH from the first wireframe — not bolted on after." },
      { num: "03", h: "The result", body: "Shipped in 12 days. The site reads like a bakery, not a SaaS product. Online order form converts at 8.4% (industry avg 2.1%). Khun Ploy texted me a photo of a customer reading the menu on their phone in the shop, smiling. That was the brief." },
    ];
    return (
      <div style={{ padding: "100px 56px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 56 }}>
          <div style={{ position: "sticky", top: 40, alignSelf: "start" }}>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .55 }}>The story</span>
            <h2 style={{ fontWeight: 800, fontSize: 56, lineHeight: 1, letterSpacing: "-0.035em", marginTop: 14 }}>
              How we<br/><span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, color: S.mango }}>baked it.</span>
            </h2>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
            {blocks.map((b, i) => (
              <div key={i} style={{ background: S.cream2, border: `2.5px solid ${S.ink}`, borderRadius: 24, padding: 32, boxShadow: `0 8px 0 ${S.ink}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ background: S.mango, color: S.ink, padding: "6px 12px", borderRadius: 999, border: `2px solid ${S.ink}`, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: ".14em", fontWeight: 700 }}>NO. {b.num}</span>
                  <h3 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.02em" }}>{b.h}</h3>
                </div>
                <p style={{ marginTop: 14, fontSize: 16.5, lineHeight: 1.65, color: S.ink2 }}>{b.body}</p>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  };

  const Quote = () => (
    <div style={{ padding: "100px 56px", background: S.leaf, color: S.cream, borderTop: `4px solid ${S.ink}` }}>
      <div style={{ maxWidth: 980, margin: "0 auto", textAlign: "center" }}>
        <span style={{ fontSize: 80, fontFamily: "'Instrument Serif', serif", color: S.honey }}>"</span>
        <p style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontSize: 64, lineHeight: 1.1, letterSpacing: "-0.02em", margin: 0 }}>
          It felt like a small, kind shop online — the same way it feels in person. My customers email me about the website now. That's never happened before.
        </p>
        <div style={{ marginTop: 36, fontFamily: "'JetBrains Mono', monospace", fontSize: 13, letterSpacing: ".18em", textTransform: "uppercase", opacity: .85, fontWeight: 700 }}>
          ★★★★★ &nbsp; Khun Ploy · Sundara Bakery
        </div>
      </div>
    </div>
  );

  const NextCTA = () => (
    <div style={{ padding: "100px 56px", textAlign: "center" }}>
      <Sticker bg={S.honey} rotate={-3} style={{ marginBottom: 24 }}>★ now booking · jul</Sticker>
      <h2 style={{ fontWeight: 800, fontSize: 88, lineHeight: 1, letterSpacing: "-0.04em", margin: 0 }}>
        Got a brand that<br/>deserves a <span style={{ background: S.mango, color: S.ink, padding: "0 22px", borderRadius: 24, border: `4px solid ${S.ink}`, display: "inline-block", boxShadow: `0 8px 0 ${S.ink}`, fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, transform: "rotate(-1.5deg)" }}>kind</span> site?
      </h2>
      <div style={{ marginTop: 40, display: "flex", justifyContent: "center", gap: 14 }}>
        <ChunkyBtn>Start a project →</ChunkyBtn>
        <a href="index.html" style={{ textDecoration: "none" }}>
          <ChunkyBtn bg={S.cream2} color={S.ink}>Back to home</ChunkyBtn>
        </a>
      </div>
    </div>
  );

  const App = () => (
    <div data-screen-label="Case · Sundara">
      <window.Nav />
      <Hero />
      <Showcase />
      <Stats />
      <Story />
      <Quote />
      <NextCTA />
      <window.Footer />
    </div>
  );

  // Footer is in faq-contact.jsx — load it
  const s = document.createElement("script");
  s.type = "text/babel"; s.src = "home/faq-contact.jsx";
  s.dataset.presets = "react";
  s.onload = () => ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  document.body.appendChild(s);
</script>
</body>
</html>

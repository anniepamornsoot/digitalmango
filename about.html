<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DigitalMango — About</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #F6EFE3; color: #1F3B36; }
  ul { padding: 0; margin: 0; }
  a { color: inherit; }
  details summary::-webkit-details-marker { display: none; }
  details summary::marker { display: none; }
  details[open] summary > span:last-child { transform: rotate(45deg); display: inline-block; }
  details summary > span:last-child { transition: transform .2s ease; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react" src="home/shared.jsx"></script>
<script type="text/babel" data-presets="react" src="home/nav-only.jsx"></script>
<script type="text/babel" data-presets="react" src="home/faq-contact.jsx"></script>

<script type="text/babel" data-presets="react">
  const S = window.SHARED;

  const HeroAbout = () => (
    <div style={{ padding: "80px 56px 60px", position: "relative", overflow: "hidden" }}>
      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 0.7fr", gap: 56, alignItems: "start" }}>
        <div>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .55 }}>About</span>
          <h1 style={{ fontSize: 156, lineHeight: 0.86, letterSpacing: "-0.05em", fontWeight: 800, margin: "16px 0 0" }}>
            Hi, I'm<br/>
            <span style={{ background: S.mango, color: S.ink, padding: "0 22px", borderRadius: 24, border: `4px solid ${S.ink}`, display: "inline-block", boxShadow: `0 8px 0 ${S.ink}`, fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, transform: "rotate(-1.5deg)" }}>digitalmango</span>.
          </h1>
          <p style={{ marginTop: 36, fontSize: 22, lineHeight: 1.5, color: S.ink2, maxWidth: "44ch", fontWeight: 500 }}>
            A one-person web studio in Bangkok. I build warm, hand-coded websites for small &amp; medium brands who'd rather hire a person than a logo.
          </p>
        </div>
        <div style={{ position: "relative", aspectRatio: "0.85/1", marginTop: -20 }}>
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, transform: "rotate(-4deg)", background: S.cream, border: `3px solid ${S.ink}`, borderRadius: 14, padding: 14, paddingBottom: 56, boxShadow: `0 14px 0 ${S.ink}` }}>
            <div style={{ aspectRatio: "4/5", borderRadius: 8, background: `radial-gradient(circle at 35% 30%, ${S.honey}, ${S.mango} 60%, ${S.clay})`, display: "grid", placeItems: "center" }}>
              <span style={{ fontSize: 110 }}>🥭</span>
            </div>
            <div style={{ marginTop: 12, fontFamily: "'Instrument Serif', serif", fontStyle: "italic", color: S.ink, fontSize: 18, textAlign: "center" }}>that's me, hi.</div>
          </div>
          <div style={{ position: "absolute", top: -30, right: -10, transform: "rotate(8deg)", background: S.honey, color: S.ink, border: `2.5px solid ${S.ink}`, padding: "10px 16px", borderRadius: 999, fontWeight: 700, fontSize: 12, letterSpacing: ".06em", textTransform: "uppercase", boxShadow: `0 4px 0 ${S.ink}` }}>est. 2024</div>
        </div>
      </div>
    </div>
  );

  const Story = () => {
    const blocks = [
      { num: "01", h: "I started where you probably are.", body: "I spent four years inside agencies — watching small brands pay big invoices for sites that looked like everyone else's. Bakeries got SaaS templates. Indie cafés got 'enterprise' page builders. The work felt cold, the prices felt unfair, and the founders rarely got to talk to the person actually designing their site." },
      { num: "02", h: "So in 2024, I went solo.", body: "I named the studio after the fruit I think about way too often — sweet, sunny, a little messy in the best way. The promise: hand-coded sites, fixed prices, one designer who answers your messages. No middlemen, no template farms, no 'we'll get back to you' for three weeks." },
      { num: "03", h: "Today, I'm taking on early clients.", body: "Just me, in Bangkok, taking on 2 projects at a time so each one gets the care it deserves. If you're an early client, you'll get my full attention — and a price that reflects us building this together." },
    ];
    return (
      <div style={{ padding: "80px 56px 100px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 56 }}>
          <div style={{ position: "sticky", top: 100, alignSelf: "start" }}>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .55 }}>02 — The story</span>
            <h2 style={{ fontWeight: 800, fontSize: 56, lineHeight: 1, letterSpacing: "-0.035em", marginTop: 14 }}>
              How the<br/>orchard<br/><span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, color: S.mango }}>got planted.</span>
            </h2>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
            {blocks.map((b, i) => (
              <div key={i} style={{ background: S.cream2, border: `2.5px solid ${S.ink}`, borderRadius: 24, padding: 32, boxShadow: `0 8px 0 ${S.ink}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ background: S.mango, color: S.ink, padding: "6px 12px", borderRadius: 999, border: `2px solid ${S.ink}`, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: ".14em", fontWeight: 700 }}>NO. {b.num}</span>
                  <h3 style={{ fontSize: 26, fontWeight: 700, letterSpacing: "-0.02em" }}>{b.h}</h3>
                </div>
                <p style={{ marginTop: 14, fontSize: 16.5, lineHeight: 1.65, color: S.ink2 }}>{b.body}</p>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  };

  const Stats = () => (
    <div style={{ padding: "80px 56px", background: S.ink, color: S.cream, borderTop: `4px solid ${S.ink}` }}>
      <div style={{ marginBottom: 40, maxWidth: 720 }}>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .55 }}>01 — What you actually get</span>
        <h2 style={{ fontWeight: 800, fontSize: 56, lineHeight: 1, letterSpacing: "-0.035em", marginTop: 14 }}>
          Four problems<br/>I'm built to <span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, color: S.mango }}>solve.</span>
        </h2>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 22 }}>
        {[
          { icon: "🥭", t: "Your old site doesn't sound like you.", body: "I rebuild it so the warmth you bring in person finally shows up online — not a SaaS-template version of your brand." },
          { icon: "✦", t: "Agencies quote ฿200k+ for a 5-page site.", body: "Fixed price from ฿35,000. Same hand-built quality, no account managers padding the invoice." },
          { icon: "⏱", t: "Your last freelancer ghosted.", body: "Replies in under 24 hours, every time. Monthly written reports if you're on Care. You'll always know what's next." },
          { icon: "🌿", t: "You don't want to be locked in.", body: "You own the code, the accounts, the fonts. Walk away anytime — I'll never hold your site hostage." },
        ].map((p, i) => (
          <div key={i} style={{ background: S.cream + "10", border: `2px solid ${S.cream}33`, borderRadius: 22, padding: 24 }}>
            <span style={{ fontSize: 32 }}>{p.icon}</span>
            <h3 style={{ marginTop: 14, fontSize: 19, fontWeight: 700, letterSpacing: "-0.02em", lineHeight: 1.25 }}>{p.t}</h3>
            <p style={{ marginTop: 10, fontSize: 14.5, lineHeight: 1.55, opacity: .8, fontWeight: 500 }}>{p.body}</p>
          </div>
        ))}
      </div>
    </div>
  );

  const Values = () => {
    const vals = [
      { icon: "🥭", t: "Warm beats sleek.", body: "Every brief asks for 'modern, clean, professional.' Most need warm, particular, alive. I steer toward the second.", bg: S.mango },
      { icon: "✦", t: "Fixed price, fixed scope.", body: "Quoted up-front, signed in writing. No 'a little extra' invoices three weeks in. If scope grows, we re-quote — together.", bg: S.honey },
      { icon: "🌿", t: "One designer, no handoffs.", body: "You'll never get 'let me check with the team.' I write, design, and code your site myself. Slower? Sometimes. Better? Always.", bg: S.leaf, color: S.cream },
      { icon: "♥", t: "Small brands deserve great sites.", body: "I work with founders who still answer the phone. Bakeries, studios, cafés, indie shops — the ones the internet usually ignores.", bg: S.cream2 },
      { icon: "⏱", t: "Reply within 24h, always.", body: "I'm a small studio, not a black hole. You'll always know what's happening on your project, and what's next.", bg: S.clay, color: S.cream },
      { icon: "★", t: "Ship the thing, then iterate.", body: "Perfect is the enemy of live. I'd rather ship a great v1 in 4 weeks than a 'perfect' v1 that takes 6 months and a divorce.", bg: S.cream2 },
    ];
    return (
      <div style={{ padding: "100px 56px" }}>
        <div style={{ textAlign: "center", marginBottom: 56 }}>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .55 }}>03 — What I believe</span>
          <h2 style={{ fontWeight: 800, fontSize: 72, lineHeight: 1, letterSpacing: "-0.04em", marginTop: 14 }}>
            Six things I'd<br/>tattoo on my <span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, color: S.mango }}>laptop.</span>
          </h2>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 18 }}>
          {vals.map((v, i) => (
            <div key={i} style={{ background: v.bg, color: v.color || S.ink, border: `3px solid ${S.ink}`, borderRadius: 24, padding: 28, boxShadow: `0 6px 0 ${S.ink}`, minHeight: 220 }}>
              <span style={{ fontSize: 32 }}>{v.icon}</span>
              <h3 style={{ marginTop: 14, fontSize: 22, fontWeight: 700, letterSpacing: "-0.02em" }}>{v.t}</h3>
              <p style={{ marginTop: 10, fontSize: 14.5, lineHeight: 1.55, opacity: v.color ? .9 : .8, fontWeight: 500 }}>{v.body}</p>
            </div>
          ))}
        </div>
      </div>
    );
  };

  const Stack = () => {
    const tools = [
      { t: "Design", items: ["Figma", "Pen + paper", "Cassidoo Sans", "Instrument Serif"] },
      { t: "Build", items: ["Webflow", "Framer", "Shopify", "Hand-coded HTML/CSS"] },
      { t: "Comms", items: ["Email (~24h)", "Line · @digitalmango", "Loom for walkthroughs", "Calendly"] },
      { t: "Studio fuel", items: ["Cha yen", "Walks in Lumphini", "Way too many mango songs", "One stubborn cat"] },
    ];
    return (
      <div style={{ padding: "100px 56px", background: S.cream2, borderTop: `4px solid ${S.ink}` }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 2.2fr", gap: 56, alignItems: "start", marginBottom: 40 }}>
          <div>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .55 }}>04 — Tools &amp; truths</span>
            <h2 style={{ fontWeight: 800, fontSize: 56, lineHeight: 1, letterSpacing: "-0.035em", marginTop: 14 }}>
              The boring (and<br/>not-so-boring)<br/><span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, color: S.mango }}>stack.</span>
            </h2>
          </div>
          <p style={{ fontSize: 18, lineHeight: 1.6, color: S.ink2, maxWidth: "60ch" }}>
            I pick tools that let me ship fast, hand off cleanly, and never lock you into me. If we work together, you'll own everything — code, accounts, accesses — from day one.
          </p>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 18 }}>
          {tools.map((c, i) => (
            <div key={i} style={{ background: S.cream, border: `2.5px solid ${S.ink}`, borderRadius: 22, padding: 24, boxShadow: `0 6px 0 ${S.ink}` }}>
              <h3 style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", fontWeight: 700, opacity: .55 }}>{c.t}</h3>
              <ul style={{ listStyle: "none", marginTop: 14, display: "flex", flexDirection: "column", gap: 8 }}>
                {c.items.map((it, j) => (
                  <li key={j} style={{ fontSize: 15, fontWeight: 600, display: "flex", gap: 10, alignItems: "center" }}>
                    <span style={{ width: 6, height: 6, borderRadius: "50%", background: S.mango }}/>
                    {it}
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>
      </div>
    );
  };

  const Quote = () => (
    <div style={{ padding: "120px 56px", background: S.leaf, color: S.cream, borderTop: `4px solid ${S.ink}`, textAlign: "center" }}>
      <span style={{ fontSize: 80, fontFamily: "'Instrument Serif', serif", color: S.honey, lineHeight: 0 }}>"</span>
      <p style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontSize: 64, lineHeight: 1.1, letterSpacing: "-0.02em", margin: "16px auto 0", maxWidth: 980 }}>
        Slow web is good web. Hand-built, considered, and shipped with the care of a one-person studio.
      </p>
      <div style={{ marginTop: 36, fontFamily: "'JetBrains Mono', monospace", fontSize: 13, letterSpacing: ".18em", textTransform: "uppercase", opacity: .85, fontWeight: 700 }}>
        — DigitalMango · 2026
      </div>
    </div>
  );

  const App = () => (
    <div data-screen-label="About">
      <window.Nav />
      <HeroAbout />
      <Stats />
      <Story />
      <Values />
      <Stack />
      <Quote />
      <window.Contact />
      <window.Footer />
    </div>
  );

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

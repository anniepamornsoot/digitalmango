document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 var(--cream);\n  color: var(--forest);\n  font-family: 'Plus Jakarta Sans', sans-serif;\n  font-size: 16px;\n  line-height: 1.65;\n  overflow-x: hidden;\n}\n\n/* ── SCROLL PROGRESS ── */\n.scroll-progress {\n  position: fixed; top: 0; left: 0; height: 2px;\n  background: linear-gradient(90deg, var(--mango), var(--clay), var(--leaf));\n  width: 0%; z-index: 200; transition: width .08s linear;\n  box-shadow: 0 0 12px rgba(232,160,42,0.6);\n}\n\n/* ── CURSOR SPOTLIGHT ── */\n.spotlight {\n  position: fixed; pointer-events: none; z-index: 5;\n  width: 520px; height: 520px; border-radius: 50%;\n  background: radial-gradient(circle, rgba(232,160,42,0.18) 0%, rgba(232,160,42,0) 65%);\n  transform: translate(-50%,-50%);\n  transition: opacity .4s; opacity: 0;\n  mix-blend-mode: multiply;\n}\n.spotlight.on { opacity: 1; }\n\n/* ── REVEAL ── */\n.reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s ease, transform .8s ease; }\n.reveal.in { opacity: 1; transform: translateY(0); }\n@media (prefers-reduced-motion: reduce) {\n  .reveal { opacity: 1 !important; transform: none !important; }\n  .hero-badge, .hero-headline, .hero-bottom, .hero-right { opacity: 1 !important; animation: none !important; }\n  .now-widget { transform: none !important; opacity: 1 !important; }\n}\n\n/* ── NOW WIDGET ── */\n.now-widget {\n  position: fixed; bottom: 22px; left: 22px; z-index: 90;\n  background: var(--forest); color: var(--cream);\n  border-radius: 18px; padding: 12px 16px 12px 14px;\n  display: flex; align-items: center; gap: 12px;\n  box-shadow: 0 12px 40px rgba(31,59,54,0.25);\n  font-size: 12px; max-width: 280px;\n  transform: translateY(140%); opacity: 0;\n  transition: transform .6s cubic-bezier(.2,.8,.2,1), opacity .6s;\n  border: 1px solid rgba(255,255,255,0.06);\n}\n.now-widget.up { transform: translateY(0); opacity: 1; }\n.now-disc {\n  width: 36px; height: 36px; border-radius: 50%;\n  background: var(--mango);\n  display: grid; place-items: center;\n  position: relative; flex-shrink: 0;\n  animation: spin 8s linear infinite;\n}\n.now-disc::before { content:''; width: 8px; height: 8px; border-radius: 50%; background: var(--forest); }\n.now-disc::after { content:''; position:absolute; inset: 4px; border-radius: 50%; border: 1px dashed rgba(31,59,54,0.35); }\n@keyframes spin { to { transform: rotate(360deg); } }\n.now-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(246,239,227,0.45); margin-bottom: 2px; }\n.now-line { font-family:'Instrument Serif', serif; font-style: italic; font-size: 14px; color: var(--honey); line-height: 1.25; }\n.now-close { background:none; border:none; color: rgba(246,239,227,0.4); cursor:pointer; font-size: 14px; padding: 0 0 0 4px; }\n.now-close:hover { color: var(--honey); }\n\n/* ── FLOATING PIPS ── */\n.pip-float {\n  position: absolute; border-radius: 50%;\n  pointer-events: none; z-index: 0;\n  animation: bob 7s ease-in-out infinite;\n}\n@keyframes bob {\n  0%,100% { transform: translateY(0) rotate(0deg); }\n  50% { transform: translateY(-22px) rotate(8deg); }\n}\n\n/* ── NAV ── */\nnav {\n  position: fixed; top: 0; left: 0; right: 0; z-index: 100;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 18px 48px;\n  background: rgba(246,239,227,0.92);\n  backdrop-filter: blur(12px);\n  border-bottom: 1px solid rgba(31,59,54,0.07);\n}\n.logo {\n  font-size: 15px; font-weight: 700; letter-spacing: -0.4px;\n  color: var(--forest); text-decoration: none;\n  display: flex; align-items: center; gap: 8px;\n}\n.logo-pip {\n  width: 20px; height: 20px; border-radius: 50%;\n  background: var(--mango);\n  position: relative; flex-shrink: 0;\n}\n.logo-pip::after {\n  content: ''; position: absolute; top: -1px; right: -1px;\n  width: 7px; height: 7px; border-radius: 50%; background: var(--leaf);\n}\n.nav-links { display: flex; align-items: center; gap: 28px; }\n.nav-links a {\n  font-size: 13px; font-weight: 500;\n  color: var(--muted);  <p>I work with <strong>cafés, restaurants, real estate brands, and tour operators<\u002Fstrong> — businesses that have been running for a few years and are ready for a site that actually represents them.<\u002Fp>\n      <div class=\"about-tags\">\n        <span class=\"tag mango\">Bangkok based<\u002Fspan>\n        <span class=\"tag\">Bilingual EN / TH<\u002Fspan>\n        <span class=\"tag\">Solo studio<\u002Fspan>\n        <span class=\"tag\">Fixed price<\u002Fspan>\n        <span class=\"tag\">4+ years exp.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"about-stats\">\n        <div><div class=\"stat-num\">20+<\u002Fdiv><div class=\"stat-label\">Projects<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"stat-num\">4+<\u002Fdiv><div class=\"stat-label\">Years exp.<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"stat-num\">1<\u002Fdiv><div class=\"stat-label\">Designer<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SERVICES -->\n<section>\n  <div class=\"services-header\">\n    <div>\n      <div class=\"eyebrow\">02 — Services<\u002Fdiv>\n      <div class=\"section-title\">Three flavors,<br><em>same orchard.<\u002Fem><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:16px;font-weight:300;color:var(--muted);max-width:340px;line-height:1.7\">Every project is hand-built, end-to-end — one designer who sweats every detail.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"services-grid\">\n    <a href=\"services.html\" class=\"service-card card-forest\">\n      <div class=\"s-num\">01 · Most popular<\u002Fdiv>\n      <div class=\"s-name\">New websites<\u002Fdiv>\n      <div class=\"s-desc\">Strategy, design, and build for brands launching a fresh site.<\u002Fdiv>\n      <ul class=\"s-features\"><li>Bilingual EN / TH<\u002Fli><li>Responsive on all devices<\u002Fli><li>3–5 week delivery<\u002Fli><li>30 days post-launch support<\u002Fli><\u002Ful>\n      <div class=\"s-price\">From ฿35,000 <span>/ project<\u002Fspan><\u002Fdiv>\n    <\u002Fa>\n    <a href=\"services.html\" class=\"service-card\">\n      <div class=\"s-num\">02 · Service<\u002Fdiv>\n      <div class=\"s-name\">Refreshes<\u002Fdiv>\n      <div class=\"s-desc\">For sites that work but feel tired. Same content, new posture.<\u002Fdiv>\n      <ul class=\"s-features\"><li>Usually 2–3 weeks<\u002Fli><li>Design-only or full rebuild<\u002Fli><li>No lock-in contracts<\u002Fli><\u002Ful>\n      <div class=\"s-price\">From ฿18,000 <span>/ project<\u002Fspan><\u002Fdiv>\n    <\u002Fa>\n    <a href=\"services.html\" class=\"service-card\">\n      <div class=\"s-num\">03 · Service<\u002Fdiv>\n      <div class=\"s-name\">Care &amp; iter.<\u002Fdiv>\n      <div class=\"s-desc\">Monthly retainers for brands that want a friendly hand on their site every month.<\u002Fdiv>\n      <ul class=\"s-features\"><li>Ongoing updates &amp; changes<\u002Fli><li>Priority response<\u002Fli><li>Cancel anytime<\u002Fli><\u002Ful>\n      <div class=\"s-price\">฿6,000 <span>/ month<\u002Fspan><\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROCESS -->\n<section class=\"process-section\">\n  <div class=\"process-header\">\n    <div class=\"eyebrow\">03 — How it works<\u002Fdiv>\n    <div class=\"section-title\">From \"hello\"<br><em>to \"it's live.\"<\u002Fem><\u002Fdiv>\n    <p>A simple, transparent process. No surprise invoices, no disappearing between milestones.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"process-track\">\n    <div class=\"process-step\"><div class=\"step-num\">01<\u002Fdiv><div class=\"step-title\">Free chat<\u002Fdiv><div class=\"step-body\">A 30-minute call. No pitch, no pressure — just getting to know your brand.<\u002Fdiv><\u002Fdiv>\n    <div class=\"process-step\"><div class=\"step-num\">02<\u002Fdiv><div class=\"step-title\">Tasting menu<\u002Fdiv><div class=\"step-body\">A proposal with clear scope, timeline, and fixed cost. No hidden fees.<\u002Fdiv><\u002Fdiv>\n    <div class=\"process-step\"><div class=\"step-num\">03<\u002Fdiv><div class=\"step-title\">Sketch &amp; taste<\u002Fdiv><div class=\"step-body\">Design rounds with your feedback built in. You'll always know where we are.<\u002Fdiv><\u002Fdiv>\n    <div class=\"process-step\"><div class=\"step-num\">04<\u002Fdiv><div class=\"step-title\">Build &amp; ship<\u002Fdiv><div class=\"step-body\">I build, test, and launch. Handover call + 30 days of support.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- DIFFERENCE -->\n<section class=\"diff-section\">\n  <div class=\"diff-intro\">\n    <div class=\"eyebrow\">04 — Why DigitalMango<\u002Fdiv>\n    <div class=\"section-title\">The DigitalMango<br><em>difference.<\u002Fem><\u002Fdiv>\n    <p class=\"lead\">Four things that make working with me feel <em>different<\u002Fem> — not because I say so, but because every project proves it again.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"manifesto\">\n    <div class=\"mani-row\"><div class=\"mani-num\">01<\u002Fdiv><div class=\"mani-title\">One designer.<br><em>Zero middlemen.<\u002Fem><\u002Fdiv><div class=\"mani-body\">You talk directly to the person doing the work. No account managers, no handoffs. <strong>The work feels human because a human made all of it.<\u002Fstrong><\u002Fdiv><div class=\"mani-glyph g-forest\">i<\u002Fdiv><\u002Fdiv>\n    <div class=\"mani-row\"><div class=\"mani-num\">02<\u002Fdiv><div class=\"mani-title\">Hand-built,<br><em>not template-stuffed.<\u002Fem><\u002Fdiv><div class=\"mani-body\">Every site is built from scratch — not poured into a Squarespace template. You get something that <strong>actually looks like your brand<\u002Fstrong>.<\u002Fdiv><div class=\"mani-glyph g-mango\">✂<\u002Fdiv><\u002Fdiv>\n    <div class=\"mani-row\"><div class=\"mani-num\">03<\u002Fdiv><div class=\"mani-title\">A truly<br><em>bilingual brain.<\u002Fem><\u002Fdiv><div class=\"mani-body\">Built for EN / TH from day one. I understand <strong>how Thai SMEs actually work, write, and grow<\u002Fstrong>.<\u002Fdiv><div class=\"mani-glyph g-leaf\">ม<\u002Fdiv><\u002Fdiv>\n    <div class=\"mani-row\"><div class=\"mani-num\">04<\u002Fdiv><div class=\"mani-title\">I actually care<br><em>about your brand.<\u002Fem><\u002Fdiv><div class=\"mani-body\">Small brands deserve great sites. <strong>Something genuinely considered, made with attention<\u002Fstrong>, shipped with care.<\u002Fdiv><div class=\"mani-glyph g-clay\">♥<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- NEWSLETTER -->\n<section class=\"newsletter\">\n  <div class=\"news-inner\">\n    <div class=\"news-left\">\n      <div class=\"eyebrow\">A monthly letter<\u002Fdiv>\n      <h2 class=\"news-headline\">Get the <em>ripe list.<\u002Fem><br>One email, once a month.<\u002Fh2>\n      <p class=\"news-sub\">Field notes from the studio — a recent build, a design lesson learned the hard way, and the occasional café in Bangkok worth visiting. Honest, short, never salesy.<\u002Fp>\n      <ul class=\"news-perks\">\n        <li>One issue a month · 5-minute read<\u002Fli>\n        <li>Behind-the-scenes from real client work<\u002Fli>\n        <li>Unsubscribe in one click, no hard feelings<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"news-card\">\n      <div class=\"news-card-label\">Issue ·11 · May 2026<\u002Fdiv>\n      <div class=\"news-card-title\">\"Why your homepage<br>doesn't need a hero video.\"<\u002Fdiv>\n      <form class=\"news-form\" onsubmit=\"return subscribeRipe(event)\">\n        <input type=\"email\" required=\"\" placeholder=\"your@email.com\" aria-label=\"Email\">\n        <button type=\"submit\">Subscribe →<\u002Fbutton>\n      <\u002Fform>\n      <div class=\"news-meta\">\n        <span><span class=\"dot\"><\u002Fspan>340+ small-business owners reading<\u002Fspan>\n        <span class=\"news-meta-right\">free, always<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"news-thanks\" id=\"newsThanks\">◐ You're in. Look out for the next ripe list — first Monday of the month.<\u002Fdiv

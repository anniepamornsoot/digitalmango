<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DigitalMango — Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #F6EFE3; color: #1F3B36; }
  ul { padding: 0; margin: 0; }
  a { color: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react" src="home/shared.jsx"></script>
<script type="text/babel" data-presets="react" src="home/nav-only.jsx"></script>
<script type="text/babel" data-presets="react" src="home/faq-contact.jsx"></script>

<script type="text/babel" data-presets="react">
  const S = window.SHARED;
  const { useState } = React;

  const HeroBlog = () => (
    <div style={{ padding: "80px 56px 40px", position: "relative" }}>
      <div style={{ position: "absolute", top: 100, right: 80 }}>
        <div style={{ background: S.honey, color: S.ink, border: `2.5px solid ${S.ink}`, borderRadius: 999, padding: "10px 16px", fontWeight: 700, fontSize: 12, letterSpacing: ".06em", textTransform: "uppercase", boxShadow: `0 4px 0 ${S.ink}`, transform: "rotate(-6deg)" }}>★ updated weekly-ish</div>
      </div>
      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .55 }}>Journal</span>
      <h1 style={{ fontSize: 156, lineHeight: 0.86, letterSpacing: "-0.05em", fontWeight: 800, margin: "16px 0 0" }}>
        Notes from<br/>the<br/>
        <span style={{ background: S.mango, color: S.ink, padding: "0 22px", borderRadius: 24, border: `4px solid ${S.ink}`, display: "inline-block", boxShadow: `0 8px 0 ${S.ink}`, fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, transform: "rotate(-1.5deg)" }}>orchard</span>.
      </h1>
      <p style={{ marginTop: 32, fontSize: 22, lineHeight: 1.5, color: S.ink2, maxWidth: "60ch", fontWeight: 500 }}>
        Short reads on small-studio life — pricing, process, design rabbit holes, and the messy reality of running a one-person practice.
      </p>
    </div>
  );

  const Tabs = ({ active, setActive, all }) => (
    <div style={{ padding: "0 56px 24px", display: "flex", gap: 10, flexWrap: "wrap" }}>
      {all.map((t) => (
        <button key={t} type="button" onClick={() => setActive(t)} style={{
          background: active === t ? S.ink : S.cream2, color: active === t ? S.cream : S.ink,
          border: `2px solid ${S.ink}`, borderRadius: 999,
          padding: "10px 18px", fontSize: 13, fontWeight: 700, cursor: "pointer",
          boxShadow: active === t ? `0 4px 0 ${S.mango}` : "none",
          fontFamily: "inherit", textTransform: "lowercase"
        }}>{t}</button>
      ))}
    </div>
  );

  const Featured = ({ p }) => (
    <a href="blog-post.html" style={{ textDecoration: "none", color: "inherit", display: "block", margin: "0 56px 28px" }}>
      <div style={{
        display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0,
        background: S.cream, border: `3px solid ${S.ink}`, borderRadius: 28,
        boxShadow: `0 10px 0 ${S.ink}`, overflow: "hidden",
        transition: "transform .18s ease, box-shadow .18s ease"
      }}
      onMouseEnter={(e) => { e.currentTarget.style.transform = "translateY(-3px)"; e.currentTarget.style.boxShadow = `0 13px 0 ${S.ink}`; }}
      onMouseLeave={(e) => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = `0 10px 0 ${S.ink}`; }}>
        <div style={{
          background: `radial-gradient(circle at 30% 30%, ${S.honey}, ${S.mango} 70%)`,
          padding: 40, display: "flex", flexDirection: "column", justifyContent: "space-between",
          borderRight: `3px solid ${S.ink}`, minHeight: 360
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ background: S.cream, color: S.ink, padding: "5px 12px", borderRadius: 999, border: `2px solid ${S.ink}`, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: ".14em", boxShadow: `0 3px 0 ${S.ink}` }}>★ FEATURED</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: ".14em", opacity: .65 }}>{p.cat.toUpperCase()}</span>
          </div>
          <div style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontSize: 88, lineHeight: 0.95, color: S.ink, maxWidth: "8ch" }}>"{p.pull}"</div>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: ".14em", opacity: .55 }}>JOURNAL · NO. 014</div>
        </div>
        <div style={{ padding: 40, display: "flex", flexDirection: "column", justifyContent: "center" }}>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", fontWeight: 700, opacity: .55 }}>{p.date} · {p.read}</div>
          <h2 style={{ fontWeight: 800, fontSize: 44, lineHeight: 1.05, letterSpacing: "-0.035em", marginTop: 14 }}>{p.t}</h2>
          <p style={{ marginTop: 16, fontSize: 16.5, lineHeight: 1.6, color: S.ink2 }}>{p.body}</p>
          <div style={{ marginTop: 22, display: "inline-flex", alignItems: "center", gap: 6, fontFamily: "'JetBrains Mono', monospace", fontSize: 12, letterSpacing: ".14em", fontWeight: 700, color: S.ink }}>READ THE POST →</div>
        </div>
      </div>
    </a>
  );

  const PostCard = ({ p, i }) => (
    <a href="blog-post.html" style={{ textDecoration: "none", color: "inherit", display: "block",
      background: i % 4 === 0 ? S.honey : i % 4 === 2 ? S.cream2 : S.cream,
      border: `2.5px solid ${S.ink}`, borderRadius: 22, padding: 26,
      boxShadow: `0 6px 0 ${S.ink}`,
      transform: `rotate(${(i % 3 - 1) * 0.4}deg)`,
      transition: "transform .15s ease, box-shadow .15s ease"
    }}
    onMouseEnter={(e) => { e.currentTarget.style.transform = `rotate(${(i % 3 - 1) * 0.4}deg) translateY(-3px)`; e.currentTarget.style.boxShadow = `0 9px 0 ${S.ink}`; }}
    onMouseLeave={(e) => { e.currentTarget.style.transform = `rotate(${(i % 3 - 1) * 0.4}deg)`; e.currentTarget.style.boxShadow = `0 6px 0 ${S.ink}`; }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ background: S.mango, color: S.ink, padding: "5px 11px", borderRadius: 999, border: `1.5px solid ${S.ink}`, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: ".14em" }}>{p.cat}</span>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: ".14em", opacity: .55 }}>{p.read}</span>
      </div>
      <h3 style={{ marginTop: 18, fontSize: 24, fontWeight: 700, letterSpacing: "-0.025em", lineHeight: 1.15 }}>{p.t}</h3>
      <p style={{ marginTop: 10, fontSize: 14.5, lineHeight: 1.55, color: S.ink2 }}>{p.body}</p>
      <div style={{ marginTop: 18, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: ".14em", fontWeight: 700, opacity: .55 }}>{p.date} · DIGITALMANGO</div>
    </a>
  );

  const Posts = () => {
    const [active, setActive] = useState("all");
    const cats = ["all", "process", "pricing", "design", "studio life"];
    const featured = { cat: "process", pull: "fixed price.", date: "12 APR 2026", read: "6 min read", t: "Why I quote a fixed price (and how I get it right)", body: "Three years of mistakes, four pricing experiments, one rule that finally stuck. Plus: the Notion template I use to scope every project before I send a number." };
    const posts = [
      { cat: "PRICING", read: "4 min", t: "How I priced my first ฿35k project (and lost money)", body: "A small studio's first proper invoice — what went well, what bled, and how I'd quote it again today.", date: "28 MAR 2026" },
      { cat: "DESIGN", read: "5 min", t: "The case for one cream, two greens, and a mango", body: "Picking a palette as a one-person studio: why fewer colors made more sense than a 'full system,' and the four hex codes I keep coming back to.", date: "14 MAR 2026" },
      { cat: "STUDIO LIFE", read: "3 min", t: "Two clients at a time, no more", body: "I tried three. I tried four. Here's why two is the magic number for a studio of one — and how I say no kindly.", date: "02 MAR 2026" },
      { cat: "PROCESS", read: "7 min", t: "What goes in a 'tasting menu' proposal", body: "The exact 6-section template I send before any project starts. Free download at the bottom.", date: "20 FEB 2026" },
      { cat: "DESIGN", read: "6 min", t: "Hand-coded vs Webflow vs Framer in 2026", body: "I use all three. Here's when each one wins, when each one loses, and the question I ask before I open any of them.", date: "08 FEB 2026" },
      { cat: "STUDIO LIFE", read: "4 min", t: "Replying within 24 hours: the only system that works", body: "How I keep a small inbox feeling like a real conversation — without becoming the worst version of an account manager.", date: "26 JAN 2026" },
    ];
    const filtered = active === "all" ? posts : posts.filter((p) => p.cat.toLowerCase() === active);
    return (
      <>
        <Featured p={featured} />
        <Tabs active={active} setActive={setActive} all={cats} />
        <div style={{ padding: "12px 56px 80px", display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 20 }}>
          {filtered.map((p, i) => <PostCard key={i} p={p} i={i} />)}
        </div>
      </>
    );
  };

  const Newsletter = () => (
    <div style={{ padding: "100px 56px", background: S.ink, color: S.cream, borderTop: `4px solid ${S.ink}`, textAlign: "center" }}>
      <div style={{ maxWidth: 720, margin: "0 auto" }}>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: ".18em", textTransform: "uppercase", opacity: .65 }}>Subscribe</span>
        <h2 style={{ fontWeight: 800, fontSize: 64, lineHeight: 1, letterSpacing: "-0.04em", marginTop: 14 }}>
          One short note,<br/>
          <span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: "italic", fontWeight: 400, color: S.mango }}>once a month.</span>
        </h2>
        <p style={{ marginTop: 18, fontSize: 17, lineHeight: 1.6, opacity: .85 }}>
          Behind-the-scenes from the studio, the post I'm most proud of, and zero growth-hacking.
        </p>
        <form onSubmit={(e) => e.preventDefault()} style={{ marginTop: 28, display: "flex", gap: 10, maxWidth: 480, margin: "28px auto 0" }}>
          <input type="email" placeholder="you@brand.co" style={{
            flex: 1, background: S.cream, border: `2px solid ${S.cream}`, borderRadius: 999,
            padding: "14px 20px", fontSize: 15, color: S.ink, fontWeight: 500, fontFamily: "inherit"
          }}/>
          <button type="submit" style={{
            background: S.mango, color: S.ink, border: `2px solid ${S.ink}`,
            padding: "14px 24px", borderRadius: 999, fontSize: 14, fontWeight: 800,
            boxShadow: `0 4px 0 ${S.cream}`, cursor: "pointer", fontFamily: "inherit"
          }}>Subscribe →</button>
        </form>
        <div style={{ marginTop: 18, fontSize: 12, opacity: .55 }}>~250 subscribers · unsubscribe in one click</div>
      </div>
    </div>
  );

  const App = () => (
    <div data-screen-label="Journal">
      <window.Nav />
      <HeroBlog />
      <Posts />
      <Newsletter />
      <window.Footer />
    </div>
  );

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
